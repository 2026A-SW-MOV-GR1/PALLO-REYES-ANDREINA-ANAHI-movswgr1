[versions]
agp = "9.1.1"
coreKtx = "1.15.0"
junit = "4.13.2"
junitVersion = "1.3.0"
espressoCore = "3.7.0"
appcompat = "1.7.1"
material = "1.14.0"
activity = "1.13.0"
constraintlayout = "2.2.1"

# ── FASE 1: Nuevas ─────────────────────────────────────────────────────────
coroutines       = "1.8.1"
lifecycleKtx     = "2.8.7"
fragmentKtx      = "1.8.2"
datastore        = "1.1.1"
securityCrypto   = "1.0.0"

[libraries]
androidx-core-ktx = { group = "androidx.core", name = "core-ktx", version.ref = "coreKtx" }
junit = { group = "junit", name = "junit", version.ref = "junit" }
androidx-junit = { group = "androidx.test.ext", name = "junit", version.ref = "junitVersion" }
androidx-espresso-core = { group = "androidx.test.espresso", name = "espresso-core", version.ref = "espressoCore" }
androidx-appcompat = { group = "androidx.appcompat", name = "appcompat", version.ref = "appcompat" }
material = { group = "com.google.android.material", name = "material", version.ref = "material" }
androidx-activity = { group = "androidx.activity", name = "activity", version.ref = "activity" }
androidx-constraintlayout = { group = "androidx.constraintlayout", name = "constraintlayout", version.ref = "constraintlayout" }

# ── FASE 1: Nuevas ─────────────────────────────────────────────────────────

# Coroutines — necesarias para HttpURLConnection async y DataStore
kotlinx-coroutines-android = { group = "org.jetbrains.kotlinx",        name = "kotlinx-coroutines-android", version.ref = "coroutines"     }

# Lifecycle — ViewModel + StateFlow + repeatOnLifecycle
lifecycle-viewmodel-ktx    = { group = "androidx.lifecycle",            name = "lifecycle-viewmodel-ktx",    version.ref = "lifecycleKtx"   }
lifecycle-runtime-ktx      = { group = "androidx.lifecycle",            name = "lifecycle-runtime-ktx",      version.ref = "lifecycleKtx"   }

# Fragment KTX — delegado by viewModels() y lifecycleScope en Fragment
androidx-fragment-ktx      = { group = "androidx.fragment",             name = "fragment-ktx",               version.ref = "fragmentKtx"    }

# Jetpack DataStore — almacenamiento asíncrono reactivo (Módulo 3)
datastore-preferences      = { group = "androidx.datastore",            name = "datastore-preferences",      version.ref = "datastore"      }

# Security Crypto — EncryptedSharedPreferences AES-256 (Módulo 3)
security-crypto            = { group = "androidx.security",             name = "security-crypto",            version.ref = "securityCrypto" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
